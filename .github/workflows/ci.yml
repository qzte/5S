# Verificações automáticas de cada push e de cada pull request.
#
# O repositório não tem build nem dependências de produção: `index.html` é um
# ficheiro único. A CI limita-se, por isso, a correr o que já existe em
# `tests/`, exactamente com os mesmos comandos documentados no README.
#
# AS ACTIONS SÃO FIXADAS POR SHA, não por etiqueta (3.5.2). Uma etiqueta como
# `@v4` é móvel: quem controlar o repositório da action decide, a qualquer
# momento e sem que nada aqui mude, que código passa a correr nesta CI. O SHA é
# imutável. O comentário ao lado diz a que versão corresponde, para que a
# actualização continue a ser legível — e é uma decisão deliberada, feita à mão,
# em vez de acontecer sozinha.
#
# Para actualizar: `git ls-remote --tags https://github.com/actions/<nome>`,
# escolher a versão e trocar o SHA e o comentário no mesmo gesto.
#
# 3.7.0: checkout v7.0.1 e setup-node v7.1.0, que correm em Node 24 (as v4
# eram de Node 20, descontinuado nos runners). Confirmar no action.yml da
# versão escolhida (`runs.using`) antes de trocar. O checkout leva
# `persist-credentials: false`: nenhum job faz push, e assim o token não
# fica gravado na configuração git do runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo no mesmo ramo cancela a execução anterior: só interessa o
# resultado do último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Testes unitários (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # O harness extrai as funções puras do index.html e avalia-as num
      # contexto vm; não há nada para instalar.
      - name: node --test tests/*.test.js
        run: node --test tests/*.test.js

  # 3.10.0: lint do JavaScript embutido no index.html. O ESLint vive em
  # tools/lint, com o seu package.json e lockfile: a app continua sem
  # dependências, e na raiz não há package.json (o Cloudflare Pages
  # instalaria dependências em cada publicação).
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Instala o ESLint (versões do lockfile)
        run: npm ci --prefix tools/lint --no-audit --no-fund

      - name: node tools/lint/lint.mjs
        run: node tools/lint/lint.mjs

  smoke:
    name: Smoke tests de browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Versão fixa: o Playwright e o Chromium que descarrega andam ao par, e
      # uma actualização silenciosa do browser é a forma mais comum de um
      # smoke test passar a falhar sem que o index.html tenha mudado.
      - name: Instala o Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0

      - name: Instala o Chromium
        run: npx playwright install --with-deps chromium

      # A aplicação é servida por HTTP porque o service worker e o fetch de
      # ficheiros não funcionam em file://.
      - name: Serve a aplicação em 127.0.0.1:8765
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/index.html >/dev/null && exit 0
            sleep 1
          done
          echo "o servidor não respondeu em 30s" >&2
          exit 1

      - name: Perguntas de amostra
        run: node tests/smoke.mjs

      - name: Edição de auditorias anteriores
        run: node tests/smoke-edicao.mjs

      - name: Responsáveis editáveis
        run: node tests/smoke-responsaveis.mjs

      - name: Painel e-ink (5s.painel.json)
        run: node tests/smoke-painel.mjs

      - name: Rascunho, cópia de segurança e nova versão
        run: node tests/smoke-rascunho.mjs

      - name: Histórico, análise, seguimento, fotos, Excel e diálogo
        run: node tests/smoke-historico.mjs

      # Prepara o dist/ com scripts/publicar.sh e serve-o noutra porta: é a
      # versão publicada, com a CSP por hashes.
      - name: CSP publicada (hashes, sem 'unsafe-inline')
        run: node tests/smoke-csp.mjs

      # O axe-core vem de tools/lint, com a versão do lockfile.
      - name: Instala o axe-core
        run: npm ci --prefix tools/lint --no-audit --no-fund

      - name: Acessibilidade (axe-core, modo claro e escuro)
        run: node tests/smoke-a11y.mjs

      - name: Armazenamento compacto, 5 000 auditorias e Excel offline
        run: node tests/smoke-armazenamento.mjs

      - name: Plano de acção
        run: node tests/smoke-acoes.mjs

      - name: Frequência, prazos e caixas de diálogo
        run: node tests/smoke-prazos.mjs

      - name: Evidência por pergunta e cópia com fotos
        run: node tests/smoke-evidencias.mjs

      # Serve uma cópia do dist/ noutra porta (8767), que o teste altera e
      # desliga para simular erros do servidor e uma actualização.
      - name: Offline, servidor em erro e actualização do service worker
        run: node tests/smoke-offline.mjs

  versao:
    name: Coerência da versão
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A versão está repetida em quatro sítios (index.html, sw.js,
      # manifest.json, README.md) e o sw.js usa-a como nome da cache: uma
      # divergência faz o browser servir a versão antiga sem qualquer aviso.
      - name: A versão tem de ser a mesma em todo o lado
        run: |
          manifesto=$(node -p "require('./manifest.json').version")
          app=$(grep -oP 'const APP_VERSION="\K[^"]+' index.html)
          sw=$(grep -oP 'const APP_VERSION = "\K[^"]+' sw.js)
          leiame=$(grep -oP '^\*\*Versão \K[0-9]+\.[0-9]+\.[0-9]+' README.md)
          echo "manifest.json: $manifesto"
          echo "index.html:    $app"
          echo "sw.js:         $sw"
          echo "README.md:     $leiame"
          for v in "$app" "$sw" "$leiame"; do
            if [ "$v" != "$manifesto" ]; then
              echo "::error::versões divergentes — ver a lista acima" >&2
              exit 1
            fi
          done

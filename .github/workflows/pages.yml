# Publica a app no GitHub Pages a partir da pasta dist/ que o scripts/publicar.sh gera, em vez de servir a raiz
# do repositório (SECURITY.md, ponto 29). Assim:
#   · vão para o ar SÓ os ficheiros da app (sem testes, CI, documentação, histórico de importações…);
#   · a CSP publicada é a de hashes, sem 'unsafe-inline' no script-src (scripts/csp.mjs).
#
# REQUISITO, que o workflow não consegue fazer por si: em Settings → Pages → Build and deployment → Source,
# escolher «GitHub Actions». Enquanto estiver em «Deploy from a branch», o passo «Publicar» falha e a app
# continua a ser servida como antes.
#
# AS ACTIONS SÃO FIXADAS POR SHA (ver o comentário do ci.yml): configure-pages v6.0.0, upload-pages-artifact v5.0.0,
# deploy-pages v5.0.1.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação de cada vez, e nunca a meio: a mais recente espera pela que está a correr.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Preparar dist/
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Falha se algum <script> ficar sem hash (scripts/csp.mjs): nunca se publica uma app sem a CSP apertada.
      - name: scripts/publicar.sh
        run: bash scripts/publicar.sh
      - name: A CSP publicada não tem 'unsafe-inline' no script-src
        run: |
          csp=$(grep -o 'Content-Security-Policy" content="[^"]*"' dist/index.html)
          script_src=$(printf '%s' "$csp" | grep -o "script-src [^;]*")
          echo "$script_src" | cut -c1-120
          if printf '%s' "$script_src" | grep -q "unsafe-inline"; then
            echo "::error::a CSP publicada ainda tem 'unsafe-inline' no script-src" >&2; exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
